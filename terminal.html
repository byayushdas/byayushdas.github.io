<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<script>
  (function() {
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>Terminal | Ayush Das</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  button:focus, button:active { outline: none !important; }
  button::-moz-focus-inner { border: 0 !important; }

  :root {
    --ink: #0a0a0a;
    --paper: #ffffff;
    --mid: #555555;
    --border: #e2e2e2;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }
  [data-theme="dark"] {
    --ink: #f0eeea;
    --paper: #0d0d0d;
    --mid: #aaaaaa;
    --border: #282828;
  }

  html, body { overflow: hidden; min-height: 100vh; display: flex; flex-direction: column; }

  body {
    background-color: var(--paper);
    background-image: radial-gradient(circle, rgba(100,100,100,0.18) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 300;
    transition: background-color 0.4s, color 0.4s;
  }
  [data-theme="dark"] body {
    background-image: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 200;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 3rem;
    height: 72px;
    background: var(--paper);
    border-bottom: 1px solid var(--border);
    transition: background 0.4s, border-color 0.4s;
  }

  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #444;
    text-decoration: none;
    transition: color 0.2s;
    cursor: pointer;
  }
  [data-theme="dark"] .nav-links a { color: #aaa; }
  .nav-links a:hover { color: var(--ink); }

  .switch-wrap {
    display: flex;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .switch-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    width: 44px;
    height: 24px;
    border-radius: 12px;
    background: #e2e2e2;
    border: none;
    cursor: pointer;
    outline: none;
    padding: 0;
    transition: background 0.35s cubic-bezier(.4,0,.2,1);
    flex-shrink: 0;
  }
  .switch-btn[aria-checked="true"] { background: #1a1a1a; }
  [data-theme="dark"] .switch-btn[aria-checked="false"] { background: #333; }
  [data-theme="dark"] .switch-btn[aria-checked="true"] { background: #2a2a2a; }
  .switch-thumb {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #1a1a1a;
    left: 2px;
    transition: transform 0.35s cubic-bezier(.4,0,.2,1), background 0.3s;
    will-change: transform;
  }
  .switch-btn[aria-checked="true"] .switch-thumb {
    transform: translateX(20px);
    background: #fde047;
    box-shadow: 0 0 10px 2px rgba(253,224,71,0.55);
  }
  [data-theme="dark"] .switch-thumb { background: #f0eeea; }

  /* Terminal Window UI */
  .terminal-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 100px 20px 40px 20px; /* Offset for nav */
  }

  .mac-window {
    width: 100%;
    max-width: 900px;
    height: 70vh;
    background: rgba(20, 20, 20, 0.9);
    border-radius: 10px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .mac-header {
    height: 38px;
    background: rgba(40, 40, 40, 0.8);
    display: flex;
    align-items: center;
    padding: 0 16px;
    position: relative;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .mac-buttons {
    display: flex;
    gap: 8px;
  }

  .mac-btn {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  .close-btn { background: #ff5f56; }
  .min-btn { background: #ffbd2e; }
  .max-btn { background: #27c93f; }

  .mac-title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--sans);
    font-size: 0.8rem;
    font-weight: 500;
    color: #999;
  }



  .terminal-body {
    flex: 1;
    padding: 20px;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: #e0e0e0;
    overflow: auto;
    cursor: text;
    line-height: 1.5;
    -ms-overflow-style: none;  /* IE and Edge */
    scrollbar-width: none;  /* Firefox */
  }

  .terminal-body::-webkit-scrollbar {
    display: none; /* Chrome, Safari and Opera */
  }



  .terminal-line {
    display: flex;
    word-break: break-word;
    margin-bottom: 4px;
    white-space: pre-wrap;
  }

  .prompt {
    color: #38bdf8;
    margin-right: 10px;
    white-space: nowrap;
    font-weight: 500;
  }



  .ascii-art {
    white-space: pre;
  }

  .txt-white { color: #ffffff; }
  .txt-magenta { color: #e879f9; }
  .txt-bold { font-weight: bold; }
  .txt-dim { opacity: 0.5; }
  .txt-cyan { color: #00ffff; text-decoration: underline; }
  .txt-cyan:hover { opacity: 0.8; }


  .cmd-input {
    background: transparent;
    border: none;
    color: #e0e0e0;
    font-family: inherit;
    font-size: inherit;
    outline: none;
    flex: 1;
    width: 100%;
  }

  .footer {
    margin-top: 5px;
    font-family: "Helvetica", "Helvetica-Bold", "Arial", sans-serif;
    font-size: 0.65rem;
    font-weight: bold;
    color: var(--ink);
    text-align: center;
    opacity: 1;
    letter-spacing: 0.08em;
    transition: color 0.4s;
    padding-bottom: 10px;
  }
  @media (max-width: 680px) {
    .footer { display: none; }
  }

  @media (max-width: 680px) {
    nav { padding: 0.8rem 1.2rem; height: 60px; }
    .terminal-container { padding: 80px 10px 20px 10px; }
    .mac-window { height: 80vh; }
    .terminal-body { 
      font-size: 0.45rem; 
      padding: 10px;
    }
  }
</style>
</head>
<body>

<nav>
  <ul class="nav-links"><li><a href="index.html">← Back to Portfolio</a></li></ul>
  <div class="nav-right">
    <div class="switch-wrap" onclick="toggleTheme()">
      <button class="switch-btn" role="switch" aria-checked="true" id="switchBtn" aria-label="Toggle dark mode">
        <span class="switch-thumb"></span>
      </button>
    </div>
  </div>
</nav>

<div class="terminal-container">
  <div class="mac-window" onclick="document.getElementById('cmdInput').focus()">
    <div class="mac-header">
      <div class="mac-buttons">
        <div class="mac-btn close-btn"></div>
        <div class="mac-btn min-btn"></div>
        <div class="mac-btn max-btn"></div>
      </div>
      <div class="mac-title">user@macbook: ~</div>
    </div>
    <div class="terminal-body" id="terminalBody">
      <div id="outputArea"></div>
      <div class="terminal-line">
        <span class="prompt">user@macbook ~ %</span>
        <input type="text" class="cmd-input" id="cmdInput" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" autofocus>
      </div>
    </div>
  </div>
</div>

<p class="footer">&copy; <span class="year"></span> Ayush Das. All rights reserved.</p>

<script>
  const switchBtn = document.getElementById('switchBtn');
  const savedTheme = localStorage.getItem('theme') || 'dark';
  if (switchBtn) {
    switchBtn.setAttribute('aria-checked', savedTheme === 'dark' ? 'true' : 'false');
  }

  function toggleTheme() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    if (switchBtn) switchBtn.setAttribute('aria-checked', String(!isDark));
  }

  const cmdInput = document.getElementById('cmdInput');
  const outputArea = document.getElementById('outputArea');
  const terminalBody = document.getElementById('terminalBody');

  const commonFooterHtml = `
<div class="terminal-line">&nbsp;</div>
<div class="terminal-line txt-white txt-bold">BUILDING. SOLVING. SELLING.</div>
<div class="terminal-line">&nbsp;</div>
<div class="terminal-line txt-dim">connect with me.</div>
<div class="terminal-line">&nbsp;</div>
<div class="terminal-line">  <span class="txt-bold">Portfolio   </span> <a href="https://byayushdas.tech/" target="_blank" class="txt-cyan">https://byayushdas.tech/</a></div>
<div class="terminal-line">&nbsp;</div>
<div class="terminal-line">  <span class="txt-bold">LinkedIn    </span> <a href="https://www.linkedin.com/in/byayushdas/" target="_blank" class="txt-cyan">https://www.linkedin.com/in/byayushdas/</a></div>
<div class="terminal-line">&nbsp;</div>
<div class="terminal-line">  <span class="txt-bold">GitHub      </span> <a href="https://github.com/byayushdas" target="_blank" class="txt-cyan">https://github.com/byayushdas</a></div>
<div class="terminal-line">&nbsp;</div>
<div class="terminal-line">  <span class="txt-bold">LeetCode    </span> <a href="https://leetcode.com/u/byayushdas/" target="_blank" class="txt-cyan">https://leetcode.com/u/byayushdas/</a></div>
<div class="terminal-line">&nbsp;</div>
<div class="terminal-line">  <span class="txt-bold">Instagram   </span> <a href="https://www.instagram.com/byayushdas/" target="_blank" class="txt-cyan">https://www.instagram.com/byayushdas/</a></div>
<div class="terminal-line">&nbsp;</div>
<div class="terminal-line">  <span class="txt-bold">X           </span> <a href="https://x.com/byayushdas" target="_blank" class="txt-cyan">https://x.com/byayushdas</a></div>
<div class="terminal-line">&nbsp;</div>
<div class="terminal-line txt-dim">thank you for visiting. ♡</div>
<div class="terminal-line">&nbsp;</div>
`;

  const asciiCardHtml = `
<div class="terminal-line ascii-art txt-white"> █████╗ ██╗   ██╗██╗   ██╗███████╗██╗  ██╗    ██████╗  █████╗ ███████╗   </div>
<div class="terminal-line ascii-art txt-white">██╔══██╗╚██╗ ██╔╝██║   ██║██╔════╝██║  ██║    ██╔══██╗██╔══██╗██╔════╝   </div>
<div class="terminal-line ascii-art txt-white">███████║ ╚████╔╝ ██║   ██║███████╗███████║    ██║  ██║███████║███████╗   </div>
<div class="terminal-line ascii-art txt-white">██╔══██║  ╚██╔╝  ██║   ██║╚════██║██╔══██║    ██║  ██║██╔══██║╚════██║   </div>
<div class="terminal-line ascii-art txt-white">██║  ██║   ██║   ╚██████╔╝███████║██║  ██║    ██████╔╝██║  ██║███████║██╗</div>
<div class="terminal-line ascii-art txt-white">╚═╝  ╚═╝   ╚═╝    ╚═════╝ ╚══════╝╚═╝  ╚═╝    ╚═════╝ ╚═╝  ╚═╝╚══════╝╚═╝</div>
` + commonFooterHtml;

  const asciiCardHtmlByAyushdas = `
<div class="terminal-line ascii-art"><span class="txt-magenta"> █████╗ ██╗   ██╗██╗   ██╗███████╗██╗  ██╗    </span><span class="txt-white">██████╗  █████╗ ███████╗   </span></div>
<div class="terminal-line ascii-art"><span class="txt-magenta">██╔══██╗╚██╗ ██╔╝██║   ██║██╔════╝██║  ██║    </span><span class="txt-white">██╔══██╗██╔══██╗██╔════╝   </span></div>
<div class="terminal-line ascii-art"><span class="txt-magenta">███████║ ╚████╔╝ ██║   ██║███████╗███████║    </span><span class="txt-white">██║  ██║███████║███████╗   </span></div>
<div class="terminal-line ascii-art"><span class="txt-magenta">██╔══██║  ╚██╔╝  ██║   ██║╚════██║██╔══██║    </span><span class="txt-white">██║  ██║██╔══██║╚════██║   </span></div>
<div class="terminal-line ascii-art"><span class="txt-magenta">██║  ██║   ██║   ╚██████╔╝███████║██║  ██║    </span><span class="txt-white">██████╔╝██║  ██║███████║██╗</span></div>
<div class="terminal-line ascii-art"><span class="txt-magenta">╚═╝  ╚═╝   ╚═╝    ╚═════╝ ╚══════╝╚═╝  ╚═╝    </span><span class="txt-white">╚═════╝ ╚═╝  ╚═╝╚══════╝╚═╝</span></div>
` + commonFooterHtml;


  cmdInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const command = cmdInput.value.trim();
      const rawCommand = cmdInput.value;
      cmdInput.value = '';
      
      const newCmdLine = document.createElement('div');
      newCmdLine.className = 'terminal-line';
      newCmdLine.innerHTML = '<span class="prompt">user@macbook ~ %</span><span>' + escapeHtml(rawCommand) + '</span>';
      outputArea.appendChild(newCmdLine);

      if (command) {
        processCommand(command);
      }
      
      terminalBody.scrollTop = terminalBody.scrollHeight;
    }
  });

  function processCommand(cmd) {
    const lowerCmd = cmd.toLowerCase();
    
    if (lowerCmd === 'clear') {
      outputArea.innerHTML = '';
      return;
    }
    
    if (lowerCmd === 'npx ayushdas') {
      const output = document.createElement('div');
      output.innerHTML = asciiCardHtml;
      outputArea.appendChild(output);
      return;
    }

    if (lowerCmd === 'npx byayushdas') {
      const output = document.createElement('div');
      output.innerHTML = asciiCardHtmlByAyushdas;
      outputArea.appendChild(output);
      return;
    }

    const errorLine = document.createElement('div');
    errorLine.className = 'terminal-line';
    errorLine.textContent = 'zsh: command not found: ' + cmd.split(' ')[0];
    outputArea.appendChild(errorLine);
  }

  function escapeHtml(unsafe) {
    return unsafe
         .replace(/&/g, "&amp;")
         .replace(/</g, "&lt;")
         .replace(/>/g, "&gt;")
         .replace(/"/g, "&quot;")
         .replace(/'/g, "&#039;");
  }

  document.querySelectorAll(".year").forEach(el => el.textContent = new Date().getFullYear());

  window.onload = () => cmdInput.focus();
</script>
</body>
</html>
