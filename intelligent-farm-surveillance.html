<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayush Das | Software Engineer</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,700&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0a0a0a;
    --paper: #ffffff;
    --surface: #f5f5f5;
    --mid: #555555;
    --border: #e2e2e2;
    --serif: 'Playfair Display', Georgia, serif;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }
  [data-theme="dark"] {
    --ink: #f0eeea;
    --paper: #0d0d0d;
    --surface: #181818;
    --mid: #aaaaaa;
    --border: #282828;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 300;
    transition: background 0.4s, color 0.4s;
  }

  /* ══════════════ NAV ══════════════ */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 200;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 3rem;
    height: 72px;
    background: var(--paper);
    border-bottom: 1px solid var(--border);
    transition: background 0.4s, border-color 0.4s;
  }
  .nav-logo {
    font-family: var(--serif);
    font-size: clamp(1.5rem, 3vw, 2rem);
    letter-spacing: 0.04em;
    color: var(--ink);
    text-decoration: none;
    cursor: pointer;
    position: relative;
    display: inline-flex;
    align-items: center;
    height: 2.6rem;
    min-width: 5rem;
    overflow: visible;
    flex-shrink: 0;
  }
  #nav-gooey-inner {
    display: flex;
    align-items: center;
    filter: url(#nav-threshold);
    height: 100%;
    position: relative;
    min-width: 5rem;
  }
  #nav-gt1, #nav-gt2 {
    position: absolute;
    font-family: var(--serif);
    font-size: clamp(1.5rem, 3vw, 2rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink);
    white-space: nowrap;
    user-select: none;
    transition: color 0.4s;
    left: 0;
    line-height: 1;
  }
  .nav-right { display: flex; align-items: center; gap: 2.5rem; }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #444;
    text-decoration: none;
    transition: color 0.2s;
    cursor: pointer;
  }
  [data-theme="dark"] .nav-links a { color: #aaa; }
  .nav-links a:hover { color: var(--ink); }

  /* ══════════════ SWITCH (framer-motion style, pure CSS+JS) ══════════════ */
  .switch-wrap {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    user-select: none;
  }
  .switch-label {
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mid);
    transition: color 0.3s;
    min-width: 2.4rem;
    text-align: right;
  }
  .switch-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    width: 44px;
    height: 24px;
    border-radius: 12px;
    background: #e2e2e2;
    border: none;
    cursor: pointer;
    outline: none;
    padding: 0;
    transition: background 0.35s cubic-bezier(.4,0,.2,1);
    flex-shrink: 0;
  }
  .switch-btn[aria-checked="true"] {
    background: #1a1a1a;
  }
  [data-theme="dark"] .switch-btn[aria-checked="false"] {
    background: #333;
  }
  [data-theme="dark"] .switch-btn[aria-checked="true"] {
    background: #2a2a2a;
  }
  .switch-thumb {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #1a1a1a;
    left: 2px;
    transition: transform 0.35s cubic-bezier(.4,0,.2,1), background 0.3s;
    will-change: transform;
  }
  .switch-btn[aria-checked="true"] .switch-thumb {
    transform: translateX(20px);
    background: #fde047; /* yellow-300 */
    box-shadow: 0 0 10px 2px rgba(253,224,71,0.55);
  }
  [data-theme="dark"] .switch-thumb { background: #f0eeea; }


  /* ══════════════ SECTIONS ══════════════ */
  /* Stack all sections absolutely, transition opacity + translateY */
  #stage {
    position: fixed;
    inset: 0;
    top: 72px; /* nav height */
    overflow: hidden;
  }
  section {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 2.5rem 3rem 2rem;
    background: var(--paper);
    opacity: 0;
    pointer-events: none;
    /* default: waiting below */
    transform: translateY(60px);
    transition:
      opacity 0.6s cubic-bezier(.4,0,.2,1),
      transform 0.6s cubic-bezier(.4,0,.2,1),
      background 0.4s, color 0.4s;
    will-change: opacity, transform;
    overflow: hidden;
  }
  section.is-active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    z-index: 2;
  }

  /* ══════════════ CONTENT WRAPPER ══════════════ */
  .content {
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    position: relative;
  }


  /* Footer */
  .footer {
    margin-top: 5px;
    font-family: var(--mono);
    font-size: 0.65rem;
    font-weight: 500;
    color: var(--ink);
    text-align: center;
    opacity: 1;
    letter-spacing: 0.08em;
    transition: color 0.4s;
  }
  .bottom-branding {
    position: absolute;
    bottom: 0.6rem;
    left: 0;
    right: 0;
    z-index: 5;
    pointer-events: none;
  }


  /* ══════════════ TYPOGRAPHY UTILS ══════════════ */
  .section-label {
    font-family: var(--mono);
    font-size: 0.63rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--mid);
    margin-bottom: 0.6rem;
  }
  .section-heading {
    font-family: var(--serif);
    font-size: clamp(1.9rem, 4vw, 3.2rem);
    font-weight: 700;
    line-height: 1.05;
    color: var(--ink);
    margin-bottom: 1.6rem;
  }
  .section-heading em { font-style: italic; font-weight: 400; }



  /* ══════════════ § 3  FARM CAROUSEL ══════════════ */
  @keyframes scroll-right {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .cert-scroll-container {
    mask: linear-gradient(90deg, transparent 0%, black 10%, black 90%, transparent 100%);
    -webkit-mask: linear-gradient(90deg, transparent 0%, black 10%, black 90%, transparent 100%);
    overflow: hidden;
    width: 100%;
    position: relative;
    padding: 20px 0;
  }
  .cert-infinite-scroll {
    display: flex;
    gap: 1rem;
    width: max-content;
    animation: scroll-right 45s linear infinite;
  }
  .cert-infinite-scroll.paused {
    animation-play-state: paused;
  }

  .cert-item {
    flex-shrink: 0;
    width: auto;
    height: 400px;
    border-radius: 8px;
    overflow: hidden;
    border: none;
    transition: transform 0.3s ease, filter 0.3s ease;
    display: block;
    background-color: transparent;
  }
  .cert-item:hover {
    transform: scale(1.05);
    filter: brightness(1.1);
    z-index: 10;
    position: relative;
  }
  .cert-item img, .cert-item video {
    width: auto;
    height: 100%;
    object-fit: contain;
    background-color: transparent;
    display: block;
  }

  video::-webkit-media-controls-start-playback-button,
  video::-webkit-media-controls {
    display: none !important;
    -webkit-appearance: none !important;
  }

  /* ══════════════ RESPONSIVE ══════════════ */
  @media (max-width: 680px) {
    nav { padding: 0.8rem 1.2rem; height: 60px; }
    #stage { top: 60px; }
    .nav-logo { display: none; }
    .nav-links { 
      display: block; 
      position: absolute; 
      left: 1.2rem; 
      top: 50%;
      transform: translateY(-50%);
    }
    .nav-right { width: 100%; justify-content: flex-end; }
    section { padding: 2rem 1.4rem 2rem; }

    .cert-item {
      width: auto;
      height: 60vw;
    }
    .project-desc { font-size: 0.75rem !important; }
  }


</style>
</head>

<script>

  // ── THEME SWITCH ──────────────────────────────────────
  const switchBtn  = document.getElementById('switchBtn');
  const themeLabel = document.getElementById('themeLabel');

  function toggleTheme() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next   = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    switchBtn.setAttribute('aria-checked', String(!isDark));
    themeLabel.textContent = isDark ? 'Light' : 'Dark';
  }


  // ── CERTIFICATIONS CAROUSEL ANIMATION LOGIC ──────────
  const certInfiniteScroll = document.getElementById('certInfiniteScroll');
  if (certInfiniteScroll) {
    // Pause on hover
    certInfiniteScroll.addEventListener('mouseenter', () => {
      certInfiniteScroll.classList.add('paused');
    });
    certInfiniteScroll.addEventListener('mouseleave', () => {
      certInfiniteScroll.classList.remove('paused');
    });
  }


  // ── DOTTED WAVE BACKGROUND ──────────────────────
  function createDottedWave(canvasId, controlName) {
    const bgCanvas = document.getElementById(canvasId);
    if (!bgCanvas) return;
    const ctx = bgCanvas.getContext('2d');

    const AMOUNTX = 50, AMOUNTY = 50;
    const SEPARATION = 100;
    const FOV_DEG = 45;

    let count = 0;
    let W = window.innerWidth;
    let H = window.innerHeight;
    let dpr = 1;
    let focalLength = 0;
    let rafId = null;

    function isDark() {
      return document.documentElement.getAttribute('data-theme') === 'dark';
    }

    function project(wx, wy, wz) {
      const cameraZ = 1500;
      const dz = cameraZ - wz;
      const dx = wx;
      const dy = wy - 100;

      const depth = dz;
      if (depth <= 0) return null;

      const scale = focalLength / depth;
      const sx = W / 2 + dx * scale;
      const sy = H / 2 - dy * scale;  // canvas Y is flipped

      const fogNear = 2000, fogFar = 10000;
      const fogAlpha = 1 - Math.min(Math.max((depth - fogNear) / (fogFar - fogNear), 0), 1);
      const radius = Math.max(0.3, 4 * scale);

      return { sx, sy, radius, fogAlpha, depth };
    }

    function resize() {
      const sec = document.getElementById('s0');
      W = sec ? sec.offsetWidth  : window.innerWidth;
      H = sec ? sec.offsetHeight : window.innerHeight;
      dpr = window.devicePixelRatio || 1;
      bgCanvas.width  = W * dpr;
      bgCanvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      focalLength = (H / 2) / Math.tan((FOV_DEG / 2) * Math.PI / 180);
    }

    function render() {
      ctx.clearRect(0, 0, W, H);

      const dark = isDark();
      const baseR = dark ? 240 : 10;
      const baseG = dark ? 238 : 10;
      const baseB = dark ? 234 : 10;
      const baseOpacity = dark ? 0.72 : 0.28;

      const pts = [];

      for (let ix = 0; ix < AMOUNTX; ix++) {
        for (let iy = 0; iy < AMOUNTY; iy++) {
          // 3D world position — exact from component
          const wx = ix * SEPARATION - (AMOUNTX * SEPARATION) / 2;
          const wy = Math.sin((ix + count) * 0.3) * 50 +
                     Math.sin((iy + count) * 0.5) * 50;
          const wz = iy * SEPARATION - (AMOUNTY * SEPARATION) / 2;

          const p = project(wx, wy, wz);
          if (!p) continue;

          // Skip if off-screen (generous margin)
          if (p.sx < -20 || p.sx > W + 20 || p.sy < -20 || p.sy > H + 20) continue;

          pts.push(p);
        }
      }

      // Sort far→near so front dots overdraw back dots
      pts.sort((a, b) => b.depth - a.depth);

      for (const p of pts) {
        const alpha = baseOpacity * p.fogAlpha;
        if (alpha < 0.01) continue;
        ctx.beginPath();
        ctx.arc(p.sx, p.sy, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${baseR},${baseG},${baseB},${alpha.toFixed(3)})`;
        ctx.fill();
      }
    }

    function loop() {
      render();
      count += 0.1;   // matches component: count += 0.1
      rafId = requestAnimationFrame(loop);
    }

    resize();
    window.addEventListener('resize', resize);
    rafId = requestAnimationFrame(loop);

    // Expose pause/resume (used by section transitions)
    window[controlName] = function(active) {
      if (active && !rafId) {
        rafId = requestAnimationFrame(loop);
      } else if (!active && rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    };
  }

  createDottedWave('dottedWaveBg', '_spiralRafControl');

  // ── FORCE VIDEO PLAY ───────────────────────────────
  document.addEventListener("DOMContentLoaded", () => {
    const videos = document.querySelectorAll("video");
    videos.forEach(v => {
      v.muted = true;
      v.setAttribute("playsinline", "");
      const playPromise = v.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          const forcePlay = () => {
            v.play();
            document.removeEventListener("touchstart", forcePlay);
            document.removeEventListener("click", forcePlay);
            document.removeEventListener("scroll", forcePlay);
          };
          document.addEventListener("touchstart", forcePlay, { passive: true });
          document.addEventListener("click", forcePlay);
          document.addEventListener("scroll", forcePlay, { passive: true });
        });
      }
    });
  });
